<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEXELSOFT STORE</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

:root{
    --bg:#f5f5f5;
    --card:#ffffff;
    --primary:#3e2723;
    --gold:#c5a065;
    --text:#222;
    --muted:#777;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Plus Jakarta Sans',sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:260px;
    height:100%;
    background:var(--primary);
    padding:25px;
    overflow:auto;
}

.logo{
    color:#fff;
    font-size:28px;
    font-weight:800;
    margin-bottom:40px;
}

.logo span{
    color:var(--gold);
}

.nav-link{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 18px;
    border-radius:14px;
    color:#fff;
    text-decoration:none;
    margin-bottom:12px;
    transition:.3s;
}

.nav-link:hover,
.nav-link.active{
    background:rgba(255,255,255,.1);
}

.main{
    margin-left:260px;
    padding:35px;
}

.hero{
    background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
    url('https://cdn.odzre.my.id/ln2.jpg');
    background-size:cover;
    background-position:center;
    padding:70px;
    border-radius:30px;
    color:#fff;
    margin-bottom:35px;
}

.hero h1{
    font-size:45px;
    margin-bottom:15px;
}

.section-title{
    font-size:30px;
    margin-bottom:25px;
    font-weight:800;
}

.menu-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:25px;
    margin-bottom:50px;
}

.card{
    background:var(--card);
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.06);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.card-content{
    padding:20px;
}

.card-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:10px;
}

.card-desc{
    font-size:14px;
    color:var(--muted);
    line-height:1.7;
    margin-bottom:18px;
}

.price{
    color:var(--gold);
    font-size:20px;
    font-weight:700;
}

.btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:14px;
    background:var(--primary);
    color:#fff;
    font-weight:700;
    cursor:pointer;
    margin-top:18px;
}

.info-card{
    background:#fff;
    border-radius:24px;
    padding:30px;
    margin-bottom:40px;
}

.method-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
    margin-top:25px;
}

.method-item{
    border:1px solid #eee;
    border-radius:18px;
    padding:25px;
    text-align:center;
}

input,
select{
    width:100%;
    height:55px;
    border-radius:14px;
    border:1px solid #ddd;
    padding:0 15px;
    margin-bottom:15px;
}

#orderResult{
    margin-top:20px;
    color:#444;
    line-height:1.7;
}

@media(max-width:900px){

    .sidebar{
        width:100%;
        height:auto;
        position:relative;
    }

    .main{
        margin-left:0;
    }

    .hero{
        padding:35px;
    }

    .hero h1{
        font-size:32px;
    }

}

</style>
</head>
<body>

<div class="sidebar">

    <div class="logo">
        VEXEL<span>SOFT</span>
    </div>

    <a href="#" onclick="switchTab('sewa')" id="nav-sewa"
    class="nav-link active">
        <i class="fas fa-server"></i>
        Sewa Bot
    </a>

    <a href="#" onclick="switchTab('minuman')" id="nav-minuman"
    class="nav-link">
        <i class="fas fa-crown"></i>
        Premium User
    </a>

    <a href="#" onclick="switchTab('sosmed')" id="nav-sosmed"
    class="nav-link">
        <i class="fas fa-bolt"></i>
        Suntik Sosmed
    </a>

</div>

<div class="main">

    <div class="hero">

        <h1>VEXELSOFT STORE</h1>

        <p>
            Website layanan bot WhatsApp, premium user,
            dan suntik sosial media otomatis.
        </p>

    </div>

    <!-- ======================== -->
    <!-- TAB SEWA -->
    <!-- ======================== -->

    <div id="sewa">

        <div class="section-title">
            Paket Hemat
        </div>

        <div id="grid-hemat" class="menu-grid"></div>

        <div class="section-title">
            Paket Premium
        </div>

        <div id="grid-premium" class="menu-grid"></div>

        <div class="section-title">
            Paket Group
        </div>

        <div id="grid-group" class="menu-grid"></div>

    </div>

    <!-- ======================== -->
    <!-- TAB PREMIUM -->
    <!-- ======================== -->

    <div id="minuman" style="display:none;">

        <div class="section-title">
            Premium User
        </div>

        <div id="grid-premium-user" class="menu-grid"></div>

    </div>

    <!-- ======================== -->
    <!-- TAB SOSMED -->
    <!-- ======================== -->

    <div id="sosmed" style="display:none;">

        <div class="section-title">
            Suntik Sosmed
        </div>

        <div class="info-card">

            <select id="serviceSelect">
                <option>Loading layanan...</option>
            </select>

            <input
            type="text"
            id="targetInput"
            placeholder="Masukkan username / link target">

            <input
            type="number"
            id="qtyInput"
            placeholder="Jumlah pesanan">

            <button class="btn" onclick="createOrder()">
                Buat Pesanan
            </button>

            <div id="orderResult"></div>

        </div>

    </div>

    <!-- PAYMENT -->

    <div class="info-card">

        <div class="section-title">
            Payment
        </div>

        <div class="method-grid">

            <div class="method-item">
                <i class="fas fa-wallet"
                style="font-size:30px;color:#ee4d2d;"></i>

                <h3 style="margin-top:10px;">
                    ShopeePay
                </h3>

                <p>083875543395</p>
            </div>

            <div class="method-item">
                <i class="fas fa-wallet"
                style="font-size:30px;color:#00AADC;"></i>

                <h3 style="margin-top:10px;">
                    GoPay
                </h3>

                <p>083875543395</p>
            </div>

            <div class="method-item">
                <i class="fas fa-wallet"
                style="font-size:30px;color:#008CBA;"></i>

                <h3 style="margin-top:10px;">
                    DANA
                </h3>

                <p>083875543395</p>
            </div>

        </div>

    </div>

</div>

<script>

/* =========================
DATA
========================= */

const paketHemat = [

{
    name:"Paket Hemat 1 Tahun",
    price:"Rp 80.000",
    desc:"Sewa bot selama 1 tahun.",
    img:"https://cdn.yupra.my.id/yp/nfuakqql.jpg"
},

{
    name:"Paket Hemat 3 Bulan",
    price:"Rp 30.000",
    desc:"Sewa bot selama 3 bulan.",
    img:"https://cdn.yupra.my.id/yp/nfuakqql.jpg"
},

{
    name:"Paket Hemat 1 Bulan",
    price:"Rp 10.000",
    desc:"Sewa bot selama 1 bulan.",
    img:"https://cdn.yupra.my.id/yp/nfuakqql.jpg"
}

];

const paketPremium = [

{
    name:"Paket Premium 1 Tahun",
    price:"Rp 100.000",
    desc:"Sewa bot + free premium user.",
    img:"https://cdn.yupra.my.id/yp/nfuakqql.jpg"
},

{
    name:"Paket Premium 1 Bulan",
    price:"Rp 15.000",
    desc:"Sewa bot premium bulanan.",
    img:"https://cdn.yupra.my.id/yp/nfuakqql.jpg"
}

];

const paketGroup = [

{
    name:"Paket Group 1 Tahun",
    price:"Rp 130.000",
    desc:"Premium group selama 1 tahun.",
    img:"https://cdn.yupra.my.id/yp/nfuakqql.jpg"
}

];

const premiumUser = [

{
    name:"Premium User 1 Bulan",
    price:"Rp 5.000",
    desc:"Premium user selama 1 bulan.",
    img:"https://cdn.odzre.my.id/zmq.jpg"
},

{
    name:"Premium User 2 Bulan",
    price:"Rp 10.000",
    desc:"Premium user selama 2 bulan.",
    img:"https://cdn.odzre.my.id/zmq.jpg"
}

];

/* =========================
RENDER CARD
========================= */

function renderCards(data, id){

    const container =
    document.getElementById(id);

    container.innerHTML = '';

    data.forEach(item => {

        container.innerHTML += `
        <div class="card">

            <img src="${item.img}">

            <div class="card-content">

                <div class="card-title">
                    ${item.name}
                </div>

                <div class="card-desc">
                    ${item.desc}
                </div>

                <div class="price">
                    ${item.price}
                </div>

                <button class="btn"
                onclick="buy('${item.name}')">
                    Order Sekarang
                </button>

            </div>

        </div>
        `;

    });

}

renderCards(paketHemat,'grid-hemat');
renderCards(paketPremium,'grid-premium');
renderCards(paketGroup,'grid-group');
renderCards(premiumUser,'grid-premium-user');

/* =========================
BUY
========================= */

function buy(name){

    const url =
    `https://wa.me/6281234567890?text=Saya ingin membeli ${name}`;

    window.open(url,'_blank');

}

/* =========================
TAB
========================= */

function switchTab(type){

    document.getElementById('sewa').style.display='none';
    document.getElementById('minuman').style.display='none';
    document.getElementById('sosmed').style.display='none';

    document.getElementById(type).style.display='block';

    document.querySelectorAll('.nav-link')
    .forEach(el => el.classList.remove('active'));

    document.getElementById('nav-' + type)
    .classList.add('active');

}

/* =========================
LOAD SERVICES
========================= */

async function loadServices(){

    const select =
    document.getElementById('serviceSelect');

    select.innerHTML =
    `<option>Loading...</option>`;

    try{

        const res =
        await fetch('/api/services');

        const data =
        await res.json();

        select.innerHTML = '';

        data.forEach(service => {

            const option =
            document.createElement('option');

            option.value = service.id;

            option.textContent =
            `${service.name} | Rp ${service.price}`;

            select.appendChild(option);

        });

    }catch(e){

        select.innerHTML =
        `<option>Gagal memuat layanan</option>`;

    }

}

loadServices();

/* =========================
CREATE ORDER
========================= */

async function createOrder(){

    const service =
    document.getElementById('serviceSelect').value;

    const target =
    document.getElementById('targetInput').value;

    const quantity =
    document.getElementById('qtyInput').value;

    const result =
    document.getElementById('orderResult');

    result.innerHTML =
    'Memproses pesanan...';

    try{

        const res = await fetch('/api/order',{

            method:'POST',

            headers:{
                'Content-Type':'application/json'
            },

            body:JSON.stringify({
                service,
                target,
                quantity
            })

        });

        const data = await res.json();

        if(data.order){

            result.innerHTML = `
            <b>Pesanan berhasil dibuat</b><br>
            ID Order: ${data.order}
            `;

        }else{

            result.innerHTML =
            data.message || 'Gagal membuat pesanan';

        }

    }catch(e){

        result.innerHTML =
        'Terjadi kesalahan';

    }

}

</script>

</body>
</html>
