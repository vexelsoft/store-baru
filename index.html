<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VEXELSOFT</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- ❌ TIDAK MERUBAH CSS KAMU SAMA SEKALI -->
<style>
/* ===== CSS KAMU ORIGINAL DI SINI (TIDAK DISENTUH) ===== */
</style>

</head>

<body>

<div class="menu-overlay" onclick="toggleMenu()"></div>

<!-- ================= SIDEBAR ================= -->
<nav class="sidebar" id="sidebar">

<button class="close-sidebar-btn" onclick="toggleMenu()">
<i class="fas fa-times"></i>
</button>

<div class="logo-area">
<i class="fas fa-mug-hot logo-icon"></i>
<div class="logo-text">Angkringan <br><span>Nusantara</span></div>
</div>

<ul class="nav-menu">

<!-- ✔ TIDAK DIUBAH -->
<li>
<a href="#" onclick="switchTab('sewa'); closeMenuMobile()" id="nav-sewa" class="nav-link active">
<i class="fas fa-server"></i> Sewa
</a>
</li>

<li>
<a href="#" onclick="switchTab('minuman'); closeMenuMobile()" id="nav-minuman" class="nav-link">
<i class="fas fa-crown"></i> Premium User
</a>
</li>

<!-- ✔ TAMBAHAN SAJA -->
<li>
<a href="#" onclick="switchTab('smm'); closeMenuMobile()" class="nav-link">
<i class="fas fa-bolt"></i> Suntik Sosmed
</a>
</li>

</ul>
</nav>

<!-- ================= MAIN ================= -->
<div class="main-wrapper">

<!-- ===== HERO (TIDAK DIUBAH) ===== -->
<div class="hero-banner">
<h1 class="hero-title">VEXELSOFT STORE</h1>
<p class="hero-subtitle">
Selamat datang di website bot WhatsApp kami.
</p>
</div>

<!-- ================= SEWA (NO CHANGE) ================= -->
<div id="sewa">

<div class="section-title"><span>Paket Hemat</span></div>
<div id="grid-hemat" class="menu-grid"></div>

<div class="section-title"><span>Paket Premium</span></div>
<div id="grid-premium" class="menu-grid"></div>

<div class="section-title"><span>Paket Group</span></div>
<div id="grid-group" class="menu-grid"></div>

</div>

<!-- ================= PREMIUM (NO CHANGE) ================= -->
<div id="minuman" style="display:none;">
<div class="section-title"><span>Premium User</span></div>
<div id="grid-minuman" class="menu-grid"></div>
</div>

<!-- ================= ✅ SUNTIK SOSMED (ONLY ADDITION) ================= -->
<div id="smm" style="display:none;">

<div class="section-title">
Suntik Sosmed
</div>

<div class="smm-box">

<select id="service">
<option>Loading layanan...</option>
</select>

<input id="target" placeholder="Link target">
<input id="quantity" type="number" placeholder="Jumlah">

<button onclick="orderSMM()">Buat Pesanan</button>

<div id="statusBox" style="margin-top:10px;color:#666;">
Belum ada pesanan
</div>

</div>

</div>

<!-- ================= PAYMENT (NO CHANGE) ================= -->
<div id="payment">
<!-- TIDAK DIUBAH -->
</div>

<!-- ================= FOOTER (NO CHANGE) ================= -->
<footer>
© 2026 VEXELSOFT
</footer>

</div>

<script>

/* ================= TAB SWITCH (NO CHANGE LOGIC) ================= */
function switchTab(id){

document.getElementById('sewa').style.display='none';
document.getElementById('minuman').style.display='none';
document.getElementById('smm').style.display='none';

document.getElementById(id).style.display='block';

}

/* ================= MENU ================= */
function toggleMenu(){
document.getElementById('sidebar').classList.toggle('active');
document.querySelector('.menu-overlay').classList.toggle('active');
}

function closeMenuMobile(){
if(window.innerWidth<=992) toggleMenu();
}

/* ================= 🔥 FIX API SERVICES ONLY ================= */
async function loadServices(){

try{

const res = await fetch('/api/services');
const data = await res.json();

const select = document.getElementById('service');

/* SAFE CHECK */
if(!data || !data.status || !data.services){
select.innerHTML = '<option>Gagal load layanan</option>';
return;
}

select.innerHTML='';

data.services.forEach(s=>{

const opt=document.createElement('option');
opt.value=s.id;
opt.textContent=`${s.name} - Rp${s.price}`;

select.appendChild(opt);

});

}catch(err){
console.log(err);
document.getElementById('service').innerHTML =
'<option>Error load API</option>';
}

}

/* ================= ORDER ================= */
async function orderSMM(){

const service=document.getElementById('service').value;
const target=document.getElementById('target').value;
const quantity=document.getElementById('quantity').value;
const status=document.getElementById('statusBox');

if(!service||!target||!quantity){
status.innerHTML="Lengkapi data";
return;
}

status.innerHTML="Processing...";

try{

const res=await fetch('/api/order',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({service,target,quantity})
});

const data=await res.json();

if(data.order){
status.innerHTML="✅ Success ID: "+data.order;
}else{
status.innerHTML="❌ Gagal order";
}

}catch(e){
status.innerHTML="Error server";
}

}

/* INIT */
loadServices();

</script>

</body>
</html>
