<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VEXELSOFT</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* ===== CSS KAMU TETAP (TIDAK DIUBAH) ===== */
:root {
    --bg-color: #fdfbf7;
    --primary-dark: #2d1b18;
    --primary-brown: #3e2723;
    --accent-gold: #c5a065;
    --accent-light: #e6dace;
    --shadow-soft: 0 10px 40px -10px rgba(62, 39, 35, 0.08);
    --shadow-hover: 0 20px 50px -10px rgba(62, 39, 35, 0.15);
    --wa-green: #25D366;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
font-family:'Plus Jakarta Sans',sans-serif;
background:var(--bg-color);
color:var(--primary-dark);
overflow-x:hidden;
}

/* ===== TAMBAHAN SMM BOX ===== */
.smm-box{
background:#fff;
padding:20px;
border-radius:20px;
box-shadow:var(--shadow-soft);
margin-top:20px;
}

.smm-box select,
.smm-box input{
width:100%;
padding:12px;
margin-top:10px;
border-radius:12px;
border:1px solid #ddd;
}

.smm-box button{
width:100%;
padding:12px;
margin-top:15px;
background:#25D366;
color:#fff;
border:none;
border-radius:12px;
font-weight:700;
cursor:pointer;
}

.status{
margin-top:10px;
font-size:14px;
color:#555;
}
</style>
</head>

<body>

<!-- ===== SIDEBAR (TAMBAH MENU SMM) ===== -->
<nav class="sidebar" id="sidebar">

<ul class="nav-menu">

<li><a href="#" onclick="switchTab('sewa')" class="nav-link active">Sewa</a></li>
<li><a href="#" onclick="switchTab('minuman')" class="nav-link">Premium</a></li>

<!-- ✅ TAMBAHAN -->
<li><a href="#" onclick="switchTab('smm')" class="nav-link">Suntik Sosmed</a></li>

</ul>

</nav>

<div class="main-wrapper">

<!-- ===== SEWA ===== -->
<div id="sewa">
<div class="section-title">Paket Hemat</div>
<div id="grid-hemat" class="menu-grid"></div>

<div class="section-title">Paket Premium</div>
<div id="grid-premium" class="menu-grid"></div>

<div class="section-title">Paket Group</div>
<div id="grid-group" class="menu-grid"></div>
</div>

<!-- ===== PREMIUM ===== -->
<div id="minuman" style="display:none;">
<div class="section-title">Premium User</div>
<div id="grid-minuman" class="menu-grid"></div>
</div>

<!-- ===== ✅ SUNTIK SOSMED FIX ===== -->
<div id="smm" style="display:none;">

<div class="section-title">
Suntik Sosmed
</div>

<div class="smm-box">

<select id="service">
<option>Loading layanan...</option>
</select>

<input id="target" placeholder="Link target">
<input id="quantity" type="number" placeholder="Jumlah">

<button onclick="orderSMM()">Buat Pesanan</button>

<div class="status" id="statusBox">Belum ada pesanan</div>

</div>
</div>

<!-- ===== PAYMENT (TETAP) ===== -->
<div id="payment">
<!-- tidak saya ubah -->
</div>

</div>

<script>

/* ===== SWITCH TAB ===== */
function switchTab(id){
document.querySelectorAll('#sewa,#minuman,#smm').forEach(el=>{
el.style.display='none';
});
document.getElementById(id).style.display='block';
}

/* ===== LOAD SERVICES FIX TOTAL ===== */
async function loadServices(){

try{

const res = await fetch('/api/services');
const data = await res.json();

const select = document.getElementById('service');

if(!data || !data.status || !Array.isArray(data.services)){
select.innerHTML = '<option>Gagal load layanan</option>';
return;
}

select.innerHTML = '';

data.services.forEach(s=>{

const opt=document.createElement('option');
opt.value=s.id;
opt.textContent=`${s.name} - Rp${s.price}`;

select.appendChild(opt);

});

}catch(e){
document.getElementById('service').innerHTML=
'<option>Error API</option>';
}

}

/* ===== ORDER ===== */
async function orderSMM(){

const service=document.getElementById('service').value;
const target=document.getElementById('target').value;
const qty=document.getElementById('quantity').value;
const status=document.getElementById('statusBox');

if(!service||!target||!qty){
status.innerHTML="Lengkapi data";
return;
}

status.innerHTML="Processing...";

try{

const res=await fetch('/api/order',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({service,target,quantity:qty})
});

const data=await res.json();

if(data.order){
status.innerHTML="✅ Order sukses ID: "+data.order;
}else{
status.innerHTML="❌ gagal";
}

}catch(e){
status.innerHTML="Error server";
}

}

/* INIT */
loadServices();

</script>

</body>
</html>
