<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VEXEHHLSOFT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ====== ALL STYLE KAMU TETAP (TIDAK DIUBAH) ====== */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#0f172a;color:white;overflow-x:hidden;}

header{
width:100%;padding:20px;display:flex;justify-content:space-between;align-items:center;
background:#111827;position:sticky;top:0;z-index:999;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.logo{font-size:22px;font-weight:700;color:#60a5fa;}

.menu{display:flex;gap:10px;flex-wrap:wrap;}

.menu button{
padding:10px 18px;border:none;border-radius:12px;background:#1e293b;
color:white;cursor:pointer;transition:0.3s;font-weight:500;
}
.menu button:hover{background:#2563eb;}

.hero{padding:70px 20px;text-align:center;}
.hero h1{font-size:42px;margin-bottom:15px;}
.hero p{max-width:700px;margin:auto;color:#cbd5e1;line-height:1.8;}

.section{padding:30px 20px;display:none;}
.section.active{display:block;}

.section-title{font-size:28px;font-weight:700;margin-bottom:25px;}

.grid{
display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;
}

.card{background:#1e293b;border-radius:20px;overflow:hidden;transition:0.3s;}
.card:hover{transform:translateY(-5px);}
.card-body{padding:18px;}
.card-title{font-size:18px;font-weight:700;margin-bottom:10px;}
.card-desc{font-size:14px;color:#cbd5e1;line-height:1.6;margin-bottom:15px;}
.card-price{font-size:20px;font-weight:700;color:#60a5fa;margin-bottom:15px;}
.card button{width:100%;height:45px;border:none;border-radius:12px;background:#2563eb;color:white;font-weight:600;cursor:pointer;}

.smm-box{
background:#1e293b;padding:20px;border-radius:20px;margin-bottom:25px;
}

/* 🔥 NEW SEARCH INPUT */
#serviceSearch{
width:100%;
height:50px;
margin-top:12px;
background:#0f172a;
border:none;
border-radius:12px;
padding:0 15px;
color:white;
outline:none;
}

.smm-box input{
width:100%;
height:50px;
margin-top:12px;
background:#0f172a;
border:none;
border-radius:12px;
padding:0 15px;
color:white;
}

.smm-box button{
width:100%;height:50px;border:none;border-radius:12px;background:#2563eb;
color:white;font-weight:700;margin-top:15px;cursor:pointer;
}

.status{
margin-top:15px;padding:15px;border-radius:12px;background:#0f172a;
font-size:14px;
}

/* 🔥 DROPDOWN RESULT LIST */
#serviceList{
max-height:200px;
overflow-y:auto;
background:#0f172a;
border-radius:12px;
margin-top:10px;
display:none;
border:1px solid rgba(255,255,255,0.1);
}

.service-item{
padding:10px;
cursor:pointer;
border-bottom:1px solid rgba(255,255,255,0.05);
font-size:13px;
}
.service-item:hover{
background:#2563eb;
}

footer{
padding:40px 20px;text-align:center;color:#94a3b8;
}

@media(max-width:768px){
.hero h1{font-size:30px;}
.menu{justify-content:center;}
}
</style>
</head>

<body>

<header>
<div class="logo">VEXEHHLSOFT</div>
<div class="menu">
<button onclick="showSection('sewa')">Sewa Bot</button>
<button onclick="showSection('premium')">Premium User</button>
<button onclick="showSection('smm')">Suntik Sosmed</button>
<button onclick="showSection('payment')">Payment</button>
</div>
</header>

<div class="hero">
<h1>VEXEHHLSOFT STORE</h1>
<p>Website layanan bot WhatsApp, premium user, dan suntik sosial media otomatis.</p>
</div>

<!-- SEWA -->
<section id="sewa" class="section active">
<div class="section-title">Paket Sewa Bot</div>
<div class="grid"></div>
</section>

<!-- PREMIUM -->
<section id="premium" class="section">
<div class="section-title">Premium User</div>
<div class="grid"></div>
</section>

<!-- SMM -->
<section id="smm" class="section">
<div class="section-title">Suntik Sosmed</div>

<div class="smm-box">

<!-- 🔥 SEARCH INPUT -->
<input type="text" id="serviceSearch" placeholder="Cari layanan (TikTok, Facebook, dll)" onkeyup="filterService()">

<!-- 🔥 LIST RESULT -->
<div id="serviceList"></div>

<input type="text" id="target" placeholder="Masukkan link target">
<input type="number" id="quantity" placeholder="Masukkan jumlah">

<button onclick="orderSMM()">Buat Pesanan</button>

<div class="status" id="statusBox">Belum ada pesanan</div>

</div>
</section>

<!-- PAYMENT -->
<section id="payment" class="section">
<div class="section-title">Metode Pembayaran</div>
</section>

<footer>© 2026 VEXEHHLSOFT</footer>

<script>

let servicesData = [];
let selectedService = null;

/* SWITCH */
function showSection(id){
document.querySelectorAll('.section').forEach(e=>e.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

/* BUY */
function buy(name){
window.open(`https://wa.me/6283875543395?text=${encodeURIComponent(name)}`,'_blank');
}

/* 🔥 LOAD SERVICES FIXED */
async function loadServices(){

try{

const res = await fetch('/api/services');
const data = await res.json();

if(!data.status || !Array.isArray(data.services)){
return;
}

servicesData = data.services;

}catch(e){
console.log(e);
}

}

loadServices();

/* 🔥 SEARCH FILTER */
function filterService(){

const q = document.getElementById('serviceSearch').value.toLowerCase();
const list = document.getElementById('serviceList');

list.innerHTML = '';

if(!q){
list.style.display = 'none';
return;
}

const filtered = servicesData.filter(s =>
s.name.toLowerCase().includes(q) ||
s.category.toLowerCase().includes(q)
);

filtered.slice(0,50).forEach(s => {

const div = document.createElement('div');
div.className = 'service-item';
div.innerHTML = `${s.name} - Rp${s.price}`;

div.onclick = () => {
selectedService = s;
document.getElementById('serviceSearch').value = s.name;
list.style.display = 'none';
};

list.appendChild(div);

});

list.style.display = 'block';

}

/* 🔥 ORDER */
async function orderSMM(){

const target = document.getElementById('target').value;
const quantity = document.getElementById('quantity').value;
const statusBox = document.getElementById('statusBox');

if(!selectedService || !target || !quantity){
statusBox.innerHTML = "Lengkapi data + pilih layanan";
return;
}

statusBox.innerHTML = "Membuat pesanan...";

try{

const res = await fetch('/api/order',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
service: selectedService.id,
target,
quantity
})
});

const data = await res.json();

if(data.order){
statusBox.innerHTML = `✅ Order sukses<br>ID: ${data.order}`;
}else{
statusBox.innerHTML = `❌ Gagal: ${JSON.stringify(data)}`;
}

}catch(e){
statusBox.innerHTML = "Error server";
}

}

</script>

</body>
</html>
