<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VEXEHHLSOFT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0f172a;
color:white;
overflow-x:hidden;
}

header{
width:100%;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
background:#111827;
position:sticky;
top:0;
z-index:999;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.logo{
font-size:22px;
font-weight:700;
color:#60a5fa;
}

.menu{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.menu button{
padding:10px 18px;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
cursor:pointer;
transition:0.3s;
font-weight:500;
}

.menu button:hover{
background:#2563eb;
}

.hero{
padding:70px 20px;
text-align:center;
}

.hero h1{
font-size:42px;
margin-bottom:15px;
}

.hero p{
max-width:700px;
margin:auto;
color:#cbd5e1;
line-height:1.8;
}

.section{
padding:30px 20px;
display:none;
}

.section.active{
display:block;
}

.section-title{
font-size:28px;
font-weight:700;
margin-bottom:25px;
}

.smm-box{
background:#1e293b;
padding:20px;
border-radius:20px;
}

.smm-box select,
.smm-box input{
width:100%;
height:50px;
margin-top:12px;
background:#0f172a;
border:none;
border-radius:12px;
padding:0 15px;
color:white;
}

.status{
margin-top:15px;
padding:15px;
border-radius:12px;
background:#0f172a;
}

footer{
padding:40px 20px;
text-align:center;
color:#94a3b8;
}

</style>
</head>

<body>

<header>
<div class="logo">VEXEHHLSOFT</div>

<div class="menu">
<button onclick="showSection('sewa')">Sewa Bot</button>
<button onclick="showSection('premium')">Premium User</button>
<button onclick="showSection('smm')">Suntik Sosmed</button>
<button onclick="showSection('payment')">Payment</button>
</div>
</header>

<div class="hero">
<h1>VEXEHHLSOFT STORE</h1>
<p>Website layanan bot WhatsApp, premium user, dan suntik sosial media otomatis.</p>
</div>

<!-- SEWA -->
<section id="sewa" class="section active">
<div class="section-title">Paket Sewa Bot</div>
</section>

<!-- PREMIUM -->
<section id="premium" class="section">
<div class="section-title">Premium User</div>
</section>

<!-- SMM -->
<section id="smm" class="section">
<div class="section-title">Suntik Sosmed</div>

<div class="smm-box">

<select id="service">
<option>Loading layanan...</option>
</select>

<input type="text" id="target" placeholder="Masukkan link target">
<input type="number" id="quantity" placeholder="Jumlah">

<div class="status" id="statusBox">Belum ada pesanan</div>

</div>

</section>

<!-- PAYMENT -->
<section id="payment" class="section">
<div class="section-title">Payment</div>
</section>

<footer>© 2026 VEXEHHLSOFT</footer>

<script>

function showSection(id){
document.querySelectorAll('.section').forEach(e=>e.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

/* ================= FIX FINAL API ================= */
async function loadServices(){

try{

const res = await fetch('https://vexehhlsoft.vercel.app/api/services', {
cache: "no-store"
});

const data = await res.json();

const select = document.getElementById('service');

console.log("API:", data);

const services = data?.services;

if(!Array.isArray(services) || services.length === 0){
select.innerHTML = '<option>Services kosong</option>';
return;
}

/* ambil 1 layanan saja dulu */
const s = services[0];

select.innerHTML = '';

const opt = document.createElement('option');
opt.value = s.id;
opt.textContent = `${s.name} - Rp${s.price}`;

select.appendChild(opt);

}catch(err){

console.log(err);

document.getElementById('service').innerHTML =
'<option>Error load services</option>';

}

}

/* init */
loadServices();

</script>

</body>
</html>
